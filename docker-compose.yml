services:
  mysql:
    image: mysql:8.4
    container_name: ai-code-reviewer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: code_reviewer
      MYSQL_USER: code_reviewer
      MYSQL_PASSWORD: code_reviewer_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
